<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SkillProof — Student</title>
  <link rel="icon" type="image/png" href="../assets/wgu-favicon.png">
  <link rel="stylesheet" href="https://brady-wgu.github.io/brady-design-system/fonts/aptos.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
    :root {
      --nav-bg: #0A2540;
      --nav-bg-2: #0F2B4A;
      --accent: #0070F0;
      --pill-bg: #13294d;
      --pill-border: rgba(255,255,255,0.14);
      --backdrop: #55657a;
      --text-dim: rgba(255,255,255,0.72);
      --font-body: 'Aptos', Arial, sans-serif;
      --frame-w: 1440px;
      --frame-h: 900px;
      --bar-h: 96px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--backdrop);
      min-height: 100vh;
    }
    body.metabar-collapsed { --bar-h: 42px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* --- the app window ------------------------------------------------
       stage centres the frame; .shot IS the fixed window and owns the only
       scrollbar the viewer should ever see. */
    .stage {
      display: flex; align-items: flex-start; justify-content: center;
      padding: 18px 18px calc(var(--bar-h) + 18px);
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .shot {
      position: relative;
      width: min(var(--frame-w), 100%);
      height: min(var(--frame-h), calc(100vh - var(--bar-h) - 36px));
      overflow-y: auto;
      overflow-x: hidden;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 44px rgba(0,0,0,0.32);
      scroll-behavior: smooth;
      /* iOS: keep the inner scroll from chaining to the page */
      overscroll-behavior: contain;
    }
    /* inner is exactly the image box, so hotspot percentages track the image */
    .shot-inner { position: relative; width: 100%; }
    .shot-inner > img { display: block; width: 100%; height: auto; }

    /* --- hotspots --- */
    .hotspot {
      position: absolute;
      margin: 0; padding: 0; border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 6px;
      transition: background 120ms, box-shadow 120ms;
    }
    .hotspot:hover,
    body.reveal-hotspots .hotspot {
      background: rgba(0,112,240,0.20);
      box-shadow: 0 0 0 2px rgba(0,112,240,0.65) inset;
    }
    .hotspot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* --- demo meta-bar --- */
    .meta-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: var(--nav-bg);
      color: #fff;
      border-top: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 -6px 24px rgba(0,0,0,0.28);
    }
    .meta-bar-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; font-size: 13px; flex-wrap: wrap;
    }
    .meta-id { font-weight: 700; }
    .meta-bar-header .spacer { margin-left: auto; }
    .persona-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text-dim); text-decoration: none;
      border: 1px solid var(--pill-border); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; font-weight: 600;
    }
    .persona-link:hover { color: #fff; background: var(--nav-bg-2); }
    .persona-link[aria-current="page"] {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .persona-link .material-icons-outlined { font-size: 15px; }
    .meta-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: #fff; border: 1px solid var(--pill-border);
      border-radius: 6px; cursor: pointer; padding: 4px; line-height: 1;
    }
    .meta-btn:hover { background: var(--nav-bg-2); }
    .meta-btn .material-icons-outlined { font-size: 18px; }
    .flow-nav {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 14px 10px;
      max-height: 54px; overflow-y: auto;
    }
    .step-btn {
      background: var(--pill-bg); color: var(--text-dim);
      border: 1px solid var(--pill-border); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; font-family: var(--font-body);
      cursor: pointer; white-space: nowrap;
    }
    .step-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
    .step-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .meta-bar.metabar-collapsed .flow-nav { display: none; }
  </style>
</head>
<body>

<div class="stage">
  <section class="screen active" id="screen-1" aria-labelledby="s1-heading">
    <h2 id="s1-heading" class="screen-heading visually-hidden" tabindex="-1">Screen 1 — Coding Coach landing</h2>
    <div class="shot">
      <div class="shot-inner">
        <img src="screenshots/screen-01.png?v=3" alt="Student: Coding Coach landing">
        <button class="hotspot" style="left:10.56%;top:47.82%;width:13.62%;height:4.67%;" aria-label="Begin the diagnostic" onclick="goToScreen(2)"></button>
      </div>
    </div>
  </section>
  <section class="screen" id="screen-2" aria-labelledby="s2-heading">
    <h2 id="s2-heading" class="screen-heading visually-hidden" tabindex="-1">Screen 2 — Diagnostic Results</h2>
    <div class="shot">
      <div class="shot-inner">
        <img src="screenshots/screen-02.png?v=3" alt="Student: Diagnostic Results">
        <button class="hotspot" style="left:38.89%;top:56.61%;width:22.22%;height:5.08%;" aria-label="View your Progress Map" onclick="goToScreen(3)"></button>
      </div>
    </div>
  </section>
  <section class="screen" id="screen-3" aria-labelledby="s3-heading">
    <h2 id="s3-heading" class="screen-heading visually-hidden" tabindex="-1">Screen 3 — Progress Map</h2>
    <div class="shot">
      <div class="shot-inner">
        <img src="screenshots/screen-03.png?v=3" alt="Student: Progress Map">
        <button class="hotspot" style="left:13.89%;top:74.37%;width:11.28%;height:4.08%;" aria-label="Start a coaching session" onclick="goToScreen(4)"></button>
      </div>
    </div>
  </section>
  <section class="screen" id="screen-4" aria-labelledby="s4-heading">
    <h2 id="s4-heading" class="screen-heading visually-hidden" tabindex="-1">Screen 4 — Help &amp; Support</h2>
    <div class="shot">
      <div class="shot-inner">
        <img src="screenshots/screen-04.png?v=3" alt="Student: Help &amp; Support">
        <button class="hotspot" style="left:20.99%;top:82.55%;width:6.11%;height:3.27%;" aria-label="Back to the course" onclick="goToScreen(1)"></button>
      </div>
    </div>
  </section>
</div>

  <nav class="meta-bar" aria-label="Demo navigation">
    <div class="meta-bar-header">
      <span class="meta-id">SkillProof Demo · Student</span>
      <span class="visually-hidden">Switch role:</span>
      <a class="persona-link" href="../student/" aria-current="page"><span class="material-icons-outlined">person</span>Student</a>
      <a class="persona-link" href="../instructor/"><span class="material-icons-outlined">school</span>Instructor</a>
      <a class="persona-link" href="../tenant_admin/"><span class="material-icons-outlined">admin_panel_settings</span>School Admin</a>
      <a class="persona-link" href="../super_admin/"><span class="material-icons-outlined">verified_user</span>Super Admin</a>
      <span class="spacer"></span>
      <a href="../" class="persona-link">&larr; Index</a>
      <button class="meta-btn" type="button" onclick="toggleReveal()" aria-pressed="false"
              title="Highlight the clickable areas on this screen" aria-label="Highlight clickable areas">
        <span class="material-icons-outlined">ads_click</span>
      </button>
      <button class="meta-btn meta-bar-toggle" type="button" onclick="toggleMetaBar()"
              aria-expanded="true" aria-label="Hide or show the navigation bar" title="Hide/show this navigation bar">
        <span class="material-icons-outlined">expand_more</span>
      </button>
    </div>
    <div class="flow-nav" role="tablist" aria-label="Screen jump buttons">
      <button class="step-btn active" data-goto="1" role="tab" aria-current="step">01 Coding Coach landing</button>
      <button class="step-btn" data-goto="2" role="tab" aria-current="false">02 Diagnostic Results</button>
      <button class="step-btn" data-goto="3" role="tab" aria-current="false">03 Progress Map</button>
      <button class="step-btn" data-goto="4" role="tab" aria-current="false">04 Help &amp; Support</button>
    </div>
  </nav>

  <script>
  (function () {
    var TOTAL = 4;

    window.goToScreen = function (n) {
      if (n < 1 || n > TOTAL) return;
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.querySelectorAll('.step-btn').forEach(function (b) {
        var on = (b.getAttribute('data-goto') === String(n));
        b.classList.toggle('active', on);
        b.setAttribute('aria-current', on ? 'step' : 'false');
      });
      var t = document.getElementById('screen-' + n);
      if (!t) return;
      t.classList.add('active');
      // Reset the frame's internal scroll: arriving on a screen should show its top,
      // the same as a real navigation would.
      var box = t.querySelector('.shot');
      if (box) box.scrollTop = 0;
      window.scrollTo(0, 0);
      var h = t.querySelector('.screen-heading');
      if (h) { h.focus({ preventScroll: true }); }
      try { history.replaceState(null, '', '?screen=' + n); } catch (e) {}
    };

    document.querySelectorAll('.step-btn').forEach(function (b) {
      b.addEventListener('click', function () { goToScreen(parseInt(b.getAttribute('data-goto'), 10)); });
    });

    document.addEventListener('keydown', function (e) {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      var a = document.querySelector('.screen.active'); if (!a) return;
      var m = a.id.match(/^screen-(\d+)$/); if (!m) return;
      var n = parseInt(m[1], 10);
      if (e.key === 'ArrowRight' && n < TOTAL) goToScreen(n + 1);
      if (e.key === 'ArrowLeft'  && n > 1)     goToScreen(n - 1);
    });

    var KEY = 'skillproof-metabar-collapsed';
    var bar = document.querySelector('.meta-bar');
    var toggle = bar && bar.querySelector('.meta-bar-toggle');
    function applyBar(c) {
      if (!bar) return;
      bar.classList.toggle('metabar-collapsed', c);
      document.body.classList.toggle('metabar-collapsed', c);
      if (toggle) toggle.setAttribute('aria-expanded', String(!c));
    }
    applyBar(localStorage.getItem(KEY) === '1');
    window.toggleMetaBar = function () {
      var c = !bar.classList.contains('metabar-collapsed');
      applyBar(c); localStorage.setItem(KEY, c ? '1' : '0');
    };

    window.toggleReveal = function () {
      var on = document.body.classList.toggle('reveal-hotspots');
      var b = document.querySelector('.meta-btn[onclick="toggleReveal()"]');
      if (b) b.setAttribute('aria-pressed', String(on));
    };

    var p = new URLSearchParams(location.search);
    var d = parseInt(p.get('screen'), 10);
    if (d >= 1 && d <= TOTAL) goToScreen(d);
  })();
  </script>
</body>
</html>
